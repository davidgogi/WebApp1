name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  tenant-isolation:
    if: github.repository == 'davidgogi/WebApp1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: e2e
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps

      - name: Check that companies can't reach each other's data
        run: npm run test:e2e

  build:
    needs: tenant-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BACKEND_IMAGE: ${{ vars.ECR_REGISTRY }}/webapp1-backend:${{ github.sha }}
      FRONTEND_IMAGE: ${{ vars.ECR_REGISTRY }}/webapp1-frontend:${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha,scope=aws-backend
          cache-to: type=gha,mode=max,scope=aws-backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha,scope=aws-frontend
          cache-to: type=gha,mode=max,scope=aws-frontend

      - name: Smoke-test the images together
        run: |
          set -euo pipefail
          docker network create smoke
          trap 'docker logs smoke-api || true; docker rm -f smoke-web smoke-api smoke-db >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_DB=webapp1 -e POSTGRES_PASSWORD=smoke postgres:16-alpine
          for attempt in {1..30}; do
            docker exec smoke-db pg_isready -U postgres -d webapp1 >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name smoke-api --network smoke --network-alias backend \
            -e DB_HOST=smoke-db -e DB_PORT=5432 -e DB_USERNAME=postgres -e DB_PASSWORD=smoke \
            -e DB_DATABASE=webapp1 -e AUTH_SECRET=smoke-secret -e SUPERUSER_PASSWORD=smoke-pw \
            "${BACKEND_IMAGE}"
          docker run -d --name smoke-web --network smoke -e BACKEND_URL=http://backend:3000 \
            --publish 127.0.0.1:8080:80 "${FRONTEND_IMAGE}"

          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/api/health | grep --quiet '"ok"' && break
            if [ "${attempt}" -eq 60 ]; then echo "API did not become healthy"; exit 1; fi
            sleep 1
          done
          login() {
            curl --silent --output /dev/null --write-out '%{http_code}' \
              -X POST http://127.0.0.1:8080/api/auth/superadmin-login \
              -H 'Content-Type: application/json' -d "{\"username\":\"superuser\",\"password\":\"$1\"}"
          }
          test "$(login smoke-pw)" = 201 || test "$(login smoke-pw)" = 200
          test "$(login superuser)" = 401

          docker exec smoke-api node node_modules/typeorm/cli.js migration:generate --check \
            -d dist/database/data-source.js dist/database/migrations/Check

          curl --fail --silent http://127.0.0.1:8080/wms/products | grep --quiet '<app-root'

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the tested images
        run: |
          docker push "${BACKEND_IMAGE}"
          docker push "${FRONTEND_IMAGE}"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update the server
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          compose=$(base64 -w0 deploy/aws/docker-compose.yml)
          caddy=$(base64 -w0 deploy/aws/Caddyfile)
          jq -n --arg compose "$compose" --arg caddy "$caddy" --arg tag "$TAG" '{commands: [
            "set -eu",
            "cd /opt/webapp1",
            "echo \($compose) | base64 -d > docker-compose.yml",
            "echo \($caddy) | base64 -d > Caddyfile",
            "sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=\($tag)/\" .env",
            "docker compose pull --quiet",
            "docker compose up -d --remove-orphans",
            "docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true",
            "docker image prune -af --filter until=168h"
          ]}' > params.json

          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${TAG:0:7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command ${id}"

          status=Pending
          for attempt in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: ${status}"
          test "$status" = Success

      - name: Check the live site
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent "https://${DOMAIN}/api/health" | grep --quiet '"ok"' && exit 0
            sleep 5
          done
          echo "https://${DOMAIN}/api/health did not answer ok"
          exit 1
