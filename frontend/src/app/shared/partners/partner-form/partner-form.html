<form class="page-stack" (ngSubmit)="save()">
  <div class="form-grid">
    <div class="field">
      <label for="partnerName">{{ 'Name' | t }}</label>
      <input
        id="partnerName"
        class="text-input"
        type="text"
        name="name"
        [(ngModel)]="name"
        [placeholder]="'e.g. Mars Georgia' | t"
        required
      />
    </div>

    <div class="field">
      <label for="partnerType">{{ 'Type' | t }}</label>
      <select id="partnerType" class="text-select" name="type" [(ngModel)]="type">
        <option value="company">{{ 'Company' | t }}</option>
        <option value="individual">{{ 'Individual' | t }}</option>
      </select>
    </div>

    <div class="field">
      <span class="field-label">{{ 'Role' | t }}</span>
      <div class="chip-list">
        <label class="check-chip" [class.check-chip--on]="isSupplier()">
          <input
            type="checkbox"
            name="isSupplier"
            [(ngModel)]="isSupplier"
            [disabled]="supplierOnly()"
          />
          {{ 'Supplier' | t }}
        </label>
        <label class="check-chip" [class.check-chip--on]="isClient()">
          <input type="checkbox" name="isClient" [(ngModel)]="isClient" />
          {{ 'Client' | t }}
        </label>
      </div>
    </div>

    <div class="field">
      <label for="partnerCode">{{ 'Identification code (optional)' | t }}</label>
      <input
        id="partnerCode"
        class="text-input"
        type="text"
        inputmode="numeric"
        name="identificationCode"
        [(ngModel)]="identificationCode"
        [placeholder]="type() === 'company' ? ('9 digits, e.g. 405123456' | t) : ('Personal ID, 11 digits' | t)"
      />
    </div>

    <div class="field">
      <label for="partnerVat">{{ 'VAT' | t }}</label>
      <select id="partnerVat" class="text-select" name="vatPayer" [(ngModel)]="vatPayer">
        <option [ngValue]="true">{{ 'VAT payer' | t }}</option>
        <option [ngValue]="false">{{ 'Not a VAT payer' | t }}</option>
      </select>
    </div>

    <div class="field">
      <label for="partnerContact">{{ 'Contact person (optional)' | t }}</label>
      <input
        id="partnerContact"
        class="text-input"
        type="text"
        name="contactPerson"
        [(ngModel)]="contactPerson"
        [placeholder]="'e.g. Nino Beridze' | t"
      />
    </div>

    <div class="field">
      <label for="partnerPhone">{{ 'Phone (optional)' | t }}</label>
      <input
        id="partnerPhone"
        class="text-input"
        type="tel"
        name="phone"
        [(ngModel)]="phone"
        [placeholder]="'e.g. +995 555 12 34 56' | t"
      />
    </div>

    <div class="field">
      <label for="partnerEmail">{{ 'Email (optional)' | t }}</label>
      <input
        id="partnerEmail"
        class="text-input"
        type="email"
        name="email"
        [(ngModel)]="email"
        [placeholder]="'e.g. orders@supplier.ge' | t"
      />
    </div>

    <div class="field">
      <label for="partnerAddress">{{ 'Address (optional)' | t }}</label>
      <input
        id="partnerAddress"
        class="text-input"
        type="text"
        name="address"
        [(ngModel)]="address"
        [placeholder]="'e.g. 12 Tsereteli Ave, Tbilisi' | t"
      />
    </div>

    <div class="field">
      <label for="partnerStatus">{{ 'Status' | t }}</label>
      <select id="partnerStatus" class="text-select" name="status" [(ngModel)]="status">
        <option value="active">{{ 'Active' | t }}</option>
        <option value="inactive">{{ 'Inactive' | t }}</option>
      </select>
      <span class="field-hint">{{ 'Inactive partners can\'t be chosen for new products or receipts.' | t }}</span>
    </div>
  </div>

  @if (formError()) {
    <p class="field-error">{{ formError() | t }}</p>
  }

  <div class="button-row">
    <button type="submit" class="button button--dark" [disabled]="isSaving()">
      @if (partner()) {
        {{ isSaving() ? ('Saving…' | t) : ('Save changes' | t) }}
      } @else {
        {{ isSaving() ? ('Adding…' | t) : ('Add partner' | t) }}
      }
    </button>
    <button type="button" class="button button--secondary" (click)="cancelled.emit()">{{ 'Cancel' | t }}</button>
  </div>
</form>
